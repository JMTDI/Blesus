name: Build

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 0.3.0 (no leading 'v')"
        required: true
        type: string

permissions:
  contents: write

jobs:
  # Bumps the version number everywhere it's declared, commits that change,
  # and tags it. Only runs when someone clicks "Run workflow" — there is no
  # push/tag trigger, so builds never happen automatically on every commit.
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.bump.outputs.version }}
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Bump version numbers
        id: bump
        run: |
          set -euo pipefail
          VERSION="${{ inputs.version }}"
          VERSION="${VERSION#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version '$VERSION' must look like 1.2.3"
            exit 1
          fi

          npm version "$VERSION" --no-git-tag-version --allow-same-version

          sed -i "0,/^version = \".*\"/{s/^version = \".*\"/version = \"$VERSION\"/}" src-tauri/Cargo.toml

          jq --arg v "$VERSION" '.version = $v' src-tauri/tauri.conf.json > tmp.json
          mv tmp.json src-tauri/tauri.conf.json

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Commit and tag
        id: commit
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json src-tauri/Cargo.toml src-tauri/tauri.conf.json
          git commit -m "chore(release): v${{ steps.bump.outputs.version }}"
          git tag "v${{ steps.bump.outputs.version }}"
          git push origin "HEAD:${{ github.ref_name }}"
          git push origin "v${{ steps.bump.outputs.version }}"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            tauri-args: "--bundles nsis"
            artifact-name: windows-setup
            artifact-path: |
              src-tauri/target/release/bundle/nsis/*.exe
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            tauri-args: "--bundles deb"
            artifact-name: linux-deb
            artifact-path: |
              src-tauri/target/release/bundle/deb/*.deb
          - os: macos-latest
            target: aarch64-apple-darwin
            tauri-args: "--bundles dmg --target aarch64-apple-darwin"
            artifact-name: macos-dmg-arm64
            artifact-path: |
              src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
          - os: macos-latest
            target: x86_64-apple-darwin
            tauri-args: "--bundles dmg --target x86_64-apple-darwin"
            artifact-name: macos-dmg-x64
            artifact-path: |
              src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.target }}

      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            libssl-dev \
            libgtk-3-dev \
            patchelf

      - name: Install npm dependencies
        run: npm ci

      - name: Install Tauri CLI
        run: npm install -g @tauri-apps/cli@^2

      - name: Build frontend (Vite only, skip tsc)
        run: npx vite build

      - name: Build Tauri app
        # Override `beforeBuildCommand` so Tauri doesn't re-run `tsc && vite build`
        # (the `tsc` step has accumulated type errors from dependency upgrades).
        shell: bash
        run: tauri build ${{ matrix.tauri-args }} -c '{"build":{"beforeBuildCommand":""}}'

      - name: Ad-hoc codesign (macOS)
        # Without an Apple Developer ID the app cannot be notarized, but ad-hoc
        # signing prevents the "app is damaged and can't be opened" Gatekeeper
        # error that shows up when macOS can find no signature at all.
        # Note: --deep is deprecated by Apple but is the correct approach for
        # ad-hoc signing where no provisioning profile or timestamp server is used.
        if: matrix.os == 'macos-latest'
        run: |
          APP_BUNDLE=$(find src-tauri/target -name "Blesus.app" -maxdepth 5 | head -1)
          if [ -n "$APP_BUNDLE" ]; then
            codesign --force --deep --sign - "$APP_BUNDLE"
            echo "Ad-hoc signed: $APP_BUNDLE"
          else
            echo "Warning: Blesus.app not found, skipping codesign"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.artifact-name }}
          path: ${{ matrix.artifact-path }}
          if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v5
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.prepare.outputs.version }}
          name: v${{ needs.prepare.outputs.version }}
          target_commitish: ${{ needs.prepare.outputs.sha }}
          generate_release_notes: true
          files: |
            artifacts/windows-setup/*
            artifacts/linux-deb/*
            artifacts/macos-dmg-arm64/*
            artifacts/macos-dmg-x64/*
